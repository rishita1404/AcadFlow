version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acadflow-postgres
    restart: always
    profiles: ["core"]
    environment:
      POSTGRES_USER: acadflow_user
      POSTGRES_PASSWORD: acadflow_password
      POSTGRES_DB: acadflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadflow_user -d acadflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acadflow-net

  mongo:
    image: mongo:6.0
    container_name: acadflow-mongo
    restart: always
    profiles: ["core"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acadflow-net

  redis:
    image: redis:7-alpine
    container_name: acadflow-redis
    restart: always
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acadflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadflow-backend
    restart: always
    profiles: ["core"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      PORT: 8000
      SECRET_KEY: acadflow-dev-secret-key-for-local-docker-testing-only-32chars
      DATABASE_URL: postgresql+psycopg://acadflow_user:acadflow_password@postgres:5432/acadflow_db
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-serve:8001
      ML_MODE: shadow
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:80"
    networks:
      - acadflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadflow-frontend
    restart: always
    profiles: ["core"]
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - acadflow-net

  ml-serve:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: acadflow-ml-serve
    restart: always
    profiles: ["ml"]
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MODEL_PATH: "/app/models/risk_model.onnx"
      JOB_FALLBACK_PATH: "/app/models/best_model.joblib"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    networks:
      - acadflow-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: acadflow-mlflow
    restart: always
    profiles: ["mlflow"]
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    networks:
      - acadflow-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: acadflow-prometheus
    restart: always
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/grafana/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - acadflow-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: acadflow-grafana
    restart: always
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=acadflow
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - acadflow-net

networks:
  acadflow-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  mlflow_data:
