version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acadflow-postgres
    restart: always
    environment:
      POSTGRES_USER: acadflow_user
      POSTGRES_PASSWORD: acadflow_password
      POSTGRES_DB: acadflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadflow_user -d acadflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acadflow-net

  mongo:
    image: mongo:6.0
    container_name: acadflow-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acadflow-net

  redis:
    image: redis:7-alpine
    container_name: acadflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - acadflow-net

  backend-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: acadflow-backend-1
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INSTANCE_ID: "api-instance-1"
      ENVIRONMENT: development
      PORT: 8000
      SECRET_KEY: acadflow-dev-secret-key-for-local-docker-testing-only-32chars
      DATABASE_URL: postgresql+psycopg://acadflow_user:acadflow_password@postgres:5432/acadflow_db
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-serve:8001
    networks:
      - acadflow-net

  backend-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: acadflow-backend-2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INSTANCE_ID: "api-instance-2"
      ENVIRONMENT: development
      PORT: 8000
      SECRET_KEY: acadflow-dev-secret-key-for-local-docker-testing-only-32chars
      DATABASE_URL: postgresql+psycopg://acadflow_user:acadflow_password@postgres:5432/acadflow_db
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-serve:8001
    networks:
      - acadflow-net

  ml-serve:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: acadflow-ml-serve
    restart: always
    ports:
      - "8001:8001"
    networks:
      - acadflow-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: acadflow-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - acadflow-net

  nginx:
    image: nginx:1.25-alpine
    container_name: acadflow-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - frontend
    networks:
      - acadflow-net

networks:
  acadflow-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
