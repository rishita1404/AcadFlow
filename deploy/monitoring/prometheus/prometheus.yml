global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'acadflow-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000', 'acadflow-backend:8000']

  - job_name: 'acadflow-ml'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-serve:8001', 'acadflow-ml-serve:8001']
