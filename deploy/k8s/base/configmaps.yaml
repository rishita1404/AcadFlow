apiVersion: v1
kind: ConfigMap
metadata:
  name: acadflow-config
  namespace: acadflow
  labels:
    app.kubernetes.io/part-of: acadflow
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://acadflow.local"
  ML_MODE: "shadow"
  ML_SERVICE_URL: "http://acadflow-ml-serve-svc.acadflow.svc.cluster.local:8001"
  REDIS_URL: "redis://acadflow-redis-svc.acadflow.svc.cluster.local:6379/0"
  MONGO_URI: "mongodb://acadflow-mongo-svc.acadflow.svc.cluster.local:27017"
  LOG_LEVEL: "INFO"
