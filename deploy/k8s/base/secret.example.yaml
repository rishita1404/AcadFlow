# ==============================================================================
# AcadFlow Kubernetes Secrets Template (Example Only)
#
# DO NOT COMMIT REAL CREDENTIALS OR ACTUAL SECRET VALUES TO VERSION CONTROL!
#
# Instructions:
# 1. Copy this file to secret.yaml (which is ignored by .gitignore):
#      cp deploy/k8s/base/secret.example.yaml deploy/k8s/base/secret.yaml
# 2. Replace the base64 or plaintext values below with your real credentials.
# 3. Alternatively, create the secret directly using kubectl:
#      kubectl create secret generic acadflow-secrets \
#        --namespace=acadflow \
#        --from-literal=SECRET_KEY="generate-strong-32-char-random-secret" \
#        --from-literal=DATABASE_URL="postgresql+psycopg://acadflow_user:password@acadflow-postgres-svc.acadflow.svc.cluster.local:5432/acadflow_db" \
#        --from-literal=POSTGRES_PASSWORD="secure_postgres_password"
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: acadflow-secrets
  namespace: acadflow
  labels:
    app.kubernetes.io/part-of: acadflow
type: Opaque
stringData:
  SECRET_KEY: "acadflow-insecure-example-secret-change-in-production-min32chars"
  DATABASE_URL: "postgresql+psycopg://acadflow_user:acadflow_password@acadflow-postgres-svc.acadflow.svc.cluster.local:5432/acadflow_db"
  POSTGRES_USER: "acadflow_user"
  POSTGRES_PASSWORD: "acadflow_password"
  POSTGRES_DB: "acadflow_db"
