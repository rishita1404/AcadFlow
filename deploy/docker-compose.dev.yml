version: '3.8'

services:
  backend-1:
    volumes:
      - ../backend:/app
    environment:
      DEBUG: "True"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
