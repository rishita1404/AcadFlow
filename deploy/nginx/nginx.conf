events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream timing and real client IP
    log_format security_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log security_combined;
    error_log  /var/log/nginx/error.log warn;

    # Security: Limit request body to prevent Denial-of-Service on uploads
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;
    send_timeout 15s;

    # Upstream backend pool: two API instances for high availability and failover
    upstream backend_api {
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ml_service {
        server ml-serve:8001 max_fails=3 fail_timeout=10s;
    }

    upstream frontend_client {
        server frontend:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard trusted proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # API routing
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ML service routing
        location /ml/ {
            proxy_pass http://ml_service/;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Frontend client routing
        location / {
            proxy_pass http://frontend_client/;
        }

        # Fallback JSON error page for 502/503/504
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"error": {"code": "SERVICE_UNAVAILABLE", "message": "Upstream service temporarily unavailable. Please retry shortly."}}';
        }
    }
}
